<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello Stefan from labs</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f7f7f4;
        color: #1f2933;
      }

      main {
        width: min(34rem, calc(100vw - 2rem));
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 8vw, 4rem);
        letter-spacing: 0;
      }

      p {
        margin: 0;
        font-size: 1.125rem;
        line-height: 1.6;
      }

      code {
        font: inherit;
        padding: 0.12rem 0.28rem;
        border-radius: 0.25rem;
        background: #e5e7eb;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #111827;
          color: #f9fafb;
        }

        code {
          background: #374151;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>hello Stefan</h1>
      <p>This page is served from the <code>nphilou/labs</code> flake at <code>/hello-stefan/</code>.</p>
    </main>
  </body>
</html>
