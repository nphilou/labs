name: Deploy to NUC

# On every push to main, bump the labs flake input in nixos-config and
# rebuild the NUC. Runs on the NUC self-hosted runner so git operations
# use the runner's ambient SSH key — no PAT required.
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-nuc
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, nuc, nixos]
    steps:
      - name: Checkout nixos-config
        run: |
          set -euo pipefail
          rm -rf nixos-config
          git clone git@github-nixos-config:nphilou/nixos-config.git nixos-config

      - name: Update labs flake input
        working-directory: nixos-config
        run: nix flake update labs

      - name: Commit and push
        working-directory: nixos-config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git diff --cached --quiet || git commit -m "chore: bump labs flake input (nuc deploy)"
          git push git@github-nixos-config:nphilou/nixos-config.git master

      - name: Rebuild NUC
        working-directory: nixos-config
        run: /run/wrappers/bin/sudo /run/current-system/sw/bin/nixos-rebuild switch --option sandbox false --flake .#nuc

      - name: Checkout labs notification
        uses: actions/checkout@v4
        with:
          path: labs

      - name: Validate labs notification
        run: python -m json.tool labs/.deploy/labs-notification.json >/dev/null

      - name: Notify Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          set -euo pipefail
          message=$(python -c 'import json, os; n=json.load(open("labs/.deploy/labs-notification.json", encoding="utf-8")); n["commit"]=os.environ["COMMIT_URL"]; print("Labs deployed to NUC\nService: {service}\nURL: {url}\nSummary: {summary}\nCommit: {commit}".format(**n))')
          curl -sS --fail "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="$message"
