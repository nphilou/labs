name: Deploy to NUC

# On every push to main, bump the labs flake input in nixos-config and
# rebuild the NUC. Runs on the NUC self-hosted runner so git operations
# use the runner's ambient SSH key — no PAT required.
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-nuc
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, nuc, nixos]
    steps:
      - name: Checkout nixos-config
        run: |
          set -euo pipefail
          rm -rf nixos-config
          git clone git@github-nixos-config:nphilou/nixos-config.git nixos-config

      - name: Update labs flake input
        working-directory: nixos-config
        run: nix flake update labs

      - name: Build NUC
        working-directory: nixos-config
        run: /run/current-system/sw/bin/nixos-rebuild build --option sandbox false --flake .#nuc

      - name: Commit and push
        id: commit
        working-directory: nixos-config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git diff --cached --quiet || git commit -m "chore: bump labs flake input (nuc deploy)"
          deploy_commit=$(git rev-parse HEAD)
          git push git@github-nixos-config:nphilou/nixos-config.git master
          echo "deploy_commit=${deploy_commit}" >> "$GITHUB_OUTPUT"

      - name: Deploy exact committed state
        working-directory: nixos-config
        run: |
          git checkout --detach "${{ steps.commit.outputs.deploy_commit }}"
          /run/wrappers/bin/sudo /run/current-system/sw/bin/nixos-rebuild switch --option sandbox false --flake .#nuc

      - name: Checkout labs notification
        uses: actions/checkout@v6
        with:
          path: labs

      - name: Read labs notification metadata
        id: notification
        working-directory: labs
        run: |
          jq -r '
            "service=\(.service)",
            "url=\(.url)",
            "summary<<EOF\n\(.summary)\nEOF"
          ' .deploy/labs-notification.json >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVICE: ${{ steps.notification.outputs.service }}
          SUMMARY: ${{ steps.notification.outputs.summary }}
          URL: ${{ steps.notification.outputs.url }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          text="Labs deploy finished

          Service: ${SERVICE}
          Summary: ${SUMMARY}
          Open: ${URL}
          Changes: ${COMMIT_URL}"

          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${text}"
