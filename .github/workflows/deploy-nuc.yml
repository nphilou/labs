name: Deploy NUC

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  trigger-nixos-config:
    name: Trigger nixos-config deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read labs notification metadata
        id: notification
        run: |
          metadata=".deploy/labs-notification.json"

          echo "service=$(jq -r .service "$metadata")" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r .url "$metadata")" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<EOF"
            jq -r .summary "$metadata"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch deploy workflow
        id: deploy
        env:
          GH_TOKEN: ${{ secrets.NIXOS_CONFIG_DISPATCH_TOKEN }}
        run: |
          output="$(gh workflow run deploy.yml \
            --repo nphilou/nixos-config \
            --ref master \
            -f flake_update=labs)"

          printf '%s\n' "$output"

          run_id="$(printf '%s\n' "$output" | sed -n 's#.*/actions/runs/\([0-9][0-9]*\).*#\1#p' | head -n1)"
          if [ -z "$run_id" ]; then
            echo "Could not find dispatched nixos-config deploy run ID." >&2
            exit 1
          fi

          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy
        env:
          GH_TOKEN: ${{ secrets.NIXOS_CONFIG_DISPATCH_TOKEN }}
          RUN_ID: ${{ steps.deploy.outputs.run_id }}
        run: gh run watch "$RUN_ID" --repo nphilou/nixos-config --exit-status

      - name: Notify Telegram
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVICE: ${{ steps.notification.outputs.service }}
          SUMMARY: ${{ steps.notification.outputs.summary }}
          URL: ${{ steps.notification.outputs.url }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          text="Labs deploy finished

          Service: ${SERVICE}
          Summary: ${SUMMARY}
          Open: ${URL}
          Changes: ${COMMIT_URL}"

          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${text}"
